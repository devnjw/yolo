name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build and verify universal disk image
        run: zsh scripts/package.sh
      - name: Save shareable installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FocusTrace-macOS-universal
          path: |
            dist/FocusTrace-*-universal.dmg
            dist/FocusTrace-*-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 14
